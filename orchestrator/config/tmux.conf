# ==============================================================================
# LexGuard AI — macOS Optimized tmux Configuration
# Native Clipboard Integration (Cmd+C / Cmd+V / Mouse Drag / pbcopy / pbpaste)
# ==============================================================================

# 1. Enable full mouse support (scroll, select text, click panes)
set -g mouse on

# 2. Terminal System Clipboard Integration (OSC 52)
set -s set-clipboard on

# 3. macOS pbcopy clipboard integration on mouse selection
# Dragging with mouse immediately copies selected text to macOS clipboard (pbcopy)
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# When pressing 'y' or 'Enter' in copy mode, copy to macOS clipboard
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Double click to select word and copy directly to macOS clipboard
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"

# Triple click to select whole line and copy directly to macOS clipboard
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

# 4. Paste buffer shortcut (Prefix + ] or Prefix + p)
bind-key p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# 5. History buffer limit (50,000 lines)
set -g history-limit 50000

# 6. Minimal escape delay (responsive)
set -s escape-time 0
