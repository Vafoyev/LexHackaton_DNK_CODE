# ============================================================
#  LexGuard AI 3.0 — Docker Compose Infrastructure
#  D-10 Directive: Pro Glanceable UI/UX, 3D Immersion & AI Live Voice
#  Services: PostgreSQL 16+pgvector, Redis, Go Backend, MinIO, Web Frontend, Admin
# ============================================================

version: "3.9"

networks:
  lexguard_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
    name: lexguard_postgres_data
  redis_data:
    name: lexguard_redis_data
  minio_data:
    name: lexguard_minio_data
  uploads_data:
    name: lexguard_uploads_data

services:
  # ──────────────────────────────────────────────
  #  1. PostgreSQL 16 + pgvector
  # ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lexguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexguard_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lexguard}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../backend/seeds/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      lexguard_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexguard} -d ${POSTGRES_DB:-lexguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c log_min_duration_statement=500
      -c log_statement=ddl

  # ──────────────────────────────────────────────
  #  2. Redis 7 (Cache & Rate-Limiting)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: lexguard_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_lexguard_2026}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      lexguard_net:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_lexguard_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────────
  #  3. MinIO (S3-compatible Object Storage)
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: lexguard_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_lexguard_2026}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      lexguard_net:
        ipv4_address: 172.28.0.12
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────
  #  4. AI Engine (Python 3.11+ gRPC + FastAPI)
  # ──────────────────────────────────────────────
  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: ../deploy/Dockerfile.ai-engine
      target: production
      args:
        PYTHON_VERSION: "3.11"
        APP_VERSION: "${APP_VERSION:-4.0.0}"
    image: lexguard/ai-engine:${APP_VERSION:-latest}
    container_name: lexguard_ai_engine
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_PORT: "8000"
      GRPC_PORT: "50051"
      DATABASE_URL: "postgres://${POSTGRES_USER:-lexguard}:${POSTGRES_PASSWORD:-lexguard_secret_2026}@postgres:5432/${POSTGRES_DB:-lexguard}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_lexguard_2026}@redis:6379/0"
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
      - "${AI_ENGINE_GRPC_PORT:-50051}:50051"
    networks:
      lexguard_net:
        ipv4_address: 172.28.0.25
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  # ──────────────────────────────────────────────
  #  5. Go Backend — Modular Monolith
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
      target: production
      args:
        GO_VERSION: "1.23"
        APP_VERSION: "${APP_VERSION:-1.0.0}"
    image: lexguard/backend:${APP_VERSION:-latest}
    container_name: lexguard_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-lexguard}:${POSTGRES_PASSWORD:-lexguard_secret_2026}@postgres:5432/${POSTGRES_DB:-lexguard}?sslmode=disable&pool_max_conns=20"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      AI_PROVIDER: ${AI_PROVIDER:-noop}
      EXTERNAL_AI_ENABLED: ${EXTERNAL_AI_ENABLED:-false}
      STORAGE_DIR: /app/uploads
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis_lexguard_2026}@redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_lexguard_2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-lexguard-documents}
      MINIO_USE_SSL: "false"
      AI_ENGINE_GRPC_ADDR: "ai-engine:50051"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      lexguard_net:
        ipv4_address: 172.28.0.20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/lexguard-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ──────────────────────────────────────────────
  #  6. Web Frontend (React + Three.js + D-10)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ../front
      dockerfile: ../deploy/Dockerfile.frontend
      target: production
      args:
        NODE_VERSION: "20"
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        APP_VERSION: "${APP_VERSION:-1.0.0}"
    image: lexguard/frontend:${APP_VERSION:-latest}
    container_name: lexguard_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      lexguard_net:
        ipv4_address: 172.28.0.30
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q 'LexGuard' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ──────────────────────────────────────────────
  #  7. Admin Portal (B2B Analytics)
  # ──────────────────────────────────────────────
  admin:
    build:
      context: ../admin
      dockerfile: ../deploy/Dockerfile.admin
      target: production
      args:
        NODE_VERSION: "20"
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: lexguard/admin:${APP_VERSION:-latest}
    container_name: lexguard_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-4000}:80"
    networks:
      lexguard_net:
        ipv4_address: 172.28.0.31
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q 'LexGuard' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
