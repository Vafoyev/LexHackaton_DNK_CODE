# ==============================================================
#  LexGuard AI — Nginx Config (Frontend + API Proxy)
#  D-10: Optimized for Three.js, SSE streams, Web Speech API
# ==============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # D-10: microphone for Voice Assistant, allow WebGL for Three.js
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src blob:;" always;

    # ── Gzip (3D WebGL bundles are large) ────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/wasm image/svg+xml;

    # ── Static Asset Caching ─────────────────────────────────
    location ~* \.(js|css|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        add_header Cache-Control "public";
    }

    # ── API Proxy → Go Backend (8080) ────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE: AI Live Voice Debrief stream support
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── Swagger Docs & OpenAPI ───────────────────────────────
    location /docs {
        proxy_pass         http://backend:8080/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /openapi.yaml {
        proxy_pass         http://backend:8080/openapi.yaml;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Health Endpoints ─────────────────────────────────────
    location = /healthz {
        return 200 '{"status":"UP","service":"lexguard-frontend","version":"1.0.0"}';
        add_header Content-Type application/json;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://backend:8080/readyz;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ── SPA Fallback (React Router) ──────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Logging ──────────────────────────────────────────────
    access_log  /var/log/nginx/lexguard_access.log combined;
    error_log   /var/log/nginx/lexguard_error.log warn;
}
